[package]
name = "rehearsal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rehearse self-hosted upgrades and issue customer-safe readiness receipts"
repository = "https://github.com/B-Divyesh/sf-selfhost-upgrade-rehearsal"
include = ["src/**", "templates/**", "examples/**", "tests/**", "README.md", "LICENSE", "CHANGELOG.md", "Cargo.lock"]

[[bin]]
name = "rehearsal"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.13"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
